<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bus Arrival - Stop H4054</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            500: '#0ea5e9',
                            600: '#0284c7',
                            900: '#0c4a6e',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
        }

        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .countdown-mono {
            font-variant-numeric: tabular-nums;
            letter-spacing: -0.05em;
        }
    </style>
</head>

<body
    class="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900">

    <div id="app" class="w-full max-w-md mx-auto">
        <!-- Main Card -->
        <div class="glass-panel rounded-2xl shadow-2xl overflow-hidden relative">

            <!-- API Key Modal -->
            <div id="apiKeyModal"
                class="absolute inset-0 z-50 bg-slate-900/95 flex flex-col items-center justify-center p-6 text-center transition-opacity duration-300">
                <div class="w-16 h-16 bg-brand-500/20 rounded-full flex items-center justify-center mb-6 animate-pulse">
                    <i class="fa-solid fa-key text-brand-500 text-2xl"></i>
                </div>
                <h2 class="text-2xl font-bold text-white mb-2">Welcome</h2>
                <p class="text-slate-400 mb-6 text-sm">Please enter your Digitransit Primary Key to access real-time
                    data.</p>
                <input type="password" id="apiKeyInput" placeholder="Paste API Key here..."
                    class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-brand-500 mb-4 transition-all"
                    autocomplete="off">
                <button onclick="saveApiKey()"
                    class="w-full bg-brand-600 hover:bg-brand-500 text-white font-medium py-3 rounded-lg transition-colors shadow-lg shadow-brand-500/20">
                    Connect
                </button>
            </div>

            <!-- Content Area -->
            <div class="p-6">
                <!-- Header -->
                <div class="flex justify-between items-start mb-6">
                    <div>
                        <div class="flex items-center gap-2 mb-1">
                            <span
                                class="bg-brand-500/20 text-brand-100 text-xs font-bold px-2 py-0.5 rounded border border-brand-500/30">H4054</span>
                            <span class="text-xs text-slate-400">HSL:1431142</span>
                        </div>
                        <h1 class="text-2xl font-bold text-white leading-tight">Bus Stop</h1>
                        <p class="text-sm text-slate-400 flex items-center gap-1 mt-1">
                            <i class="fa-solid fa-map-pin text-slate-500 text-xs"></i>
                            <span id="stopName">Loading...</span>
                        </p>
                    </div>
                    <button onclick="resetApiKey()" class="text-slate-500 hover:text-white transition-colors p-2"
                        title="Change API Key">
                        <i class="fa-solid fa-key"></i>
                    </button>
                </div>

                <!-- Next Arrival Hero -->
                <div class="mb-8 relative group">
                    <div
                        class="absolute -inset-0.5 bg-gradient-to-r from-brand-600 to-cyan-600 rounded-xl opacity-75 group-hover:opacity-100 transition duration-1000 group-hover:duration-200 blur">
                    </div>
                    <div class="relative bg-slate-900 rounded-xl p-5 border border-slate-700/50">
                        <div class="flex justify-between items-center mb-4 gap-3">
                            <div class="flex items-center gap-3 flex-1 min-w-0">
                                <div id="heroBusIcon"
                                    class="w-10 h-10 rounded-lg bg-slate-800 flex items-center justify-center text-xl font-bold text-white border border-slate-700">
                                    --
                                </div>
                                <div>
                                    <div class="flex items-center gap-2">
                                        <p class="text-xs text-slate-400 uppercase tracking-wider font-semibold">Next
                                            Bus</p>
                                        <span id="heroRealtimeBadge"
                                            class="hidden text-[10px] font-bold px-1.5 py-0.5 rounded border"></span>
                                    </div>
                                    <p id="heroDestination"
                                        class="text-white font-bold text-lg sm:text-xl truncate max-w-[180px] sm:max-w-[200px] leading-tight">
                                        --
                                    </p>
                                </div>
                            </div>
                            <div class="text-right flex-shrink-0">
                                <div id="heroCountdown"
                                    class="text-3xl sm:text-4xl font-black text-brand-500 countdown-mono leading-none tracking-tighter">
                                    --:--
                                </div>
                                <p class="text-xs text-slate-500 mt-1 font-medium">minutes</p>
                            </div>
                        </div>
                        <div class="w-full bg-slate-800 h-1 rounded-full overflow-hidden">
                            <div id="progressBar" class="h-full bg-brand-500 w-0 transition-all duration-1000">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Upcoming List -->
                <div>
                    <h3 class="text-sm font-semibold text-slate-400 mb-3 flex items-center justify-between">
                        <span>Upcoming Departures</span>
                        <span id="lastUpdated" class="text-xs font-normal text-slate-600">Updated: --</span>
                    </h3>
                    <div id="busList" class="space-y-3">
                        <div class="text-center py-8 text-slate-500 text-sm animate-pulse">
                            Connecting to HSL API...
                        </div>
                    </div>
                </div>
            </div>

            <!-- Footer -->
            <div class="bg-slate-900/50 p-3 text-center border-t border-slate-800">
                <p class="text-[10px] text-slate-600">Data via Digitransit API</p>
            </div>
        </div>
    </div>

    <script>
        // Configuration
        const DEFAULT_STOP_ID = "HSL:1431142";
        const DEFAULT_BUS_COUNT = 3;
        const API_URL = "https://api.digitransit.fi/routing/v2/hsl/gtfs/v1";
        const STORAGE_KEY = "digitransit_api_key";

        // State
        let apiKey = localStorage.getItem(STORAGE_KEY);
        let stopData = null;
        let countdownInterval = null;
        let fetchInterval = null;

        // DOM Elements
        const els = {
            modal: document.getElementById('apiKeyModal'),
            input: document.getElementById('apiKeyInput'),
            stopName: document.getElementById('stopName'),
            heroBusIcon: document.getElementById('heroBusIcon'),
            heroDestination: document.getElementById('heroDestination'),
            heroRealtimeBadge: document.getElementById('heroRealtimeBadge'),
            heroCountdown: document.getElementById('heroCountdown'),
            progressBar: document.getElementById('progressBar'),
            busList: document.getElementById('busList'),
            lastUpdated: document.getElementById('lastUpdated')
        };

        // Init
        function init() {
            if (apiKey) {
                els.modal.classList.add('opacity-0', 'pointer-events-none');
                startApp();
            }
        }

        function saveApiKey() {
            const key = els.input.value.trim();
            if (key) {
                apiKey = key;
                localStorage.setItem(STORAGE_KEY, key);
                els.modal.classList.add('opacity-0', 'pointer-events-none');
                startApp();
            } else {
                alert("Please enter a valid API key.");
            }
        }

        function resetApiKey() {
            if (confirm("Are you sure you want to disconnect?")) {
                localStorage.removeItem(STORAGE_KEY);
                apiKey = null;
                stopApp();
                els.modal.classList.remove('opacity-0', 'pointer-events-none');
            }
        }

        function startApp() {
            fetchData();
            fetchInterval = setInterval(fetchData, 60000);
            fetchInterval._interval = 60000; // Track the interval value
            countdownInterval = setInterval(updateCountdowns, 1000);
        }

        function stopApp() {
            clearInterval(fetchInterval);
            clearInterval(countdownInterval);
            els.busList.innerHTML = '';
            els.stopName.innerText = 'Loading...';
        }

        async function fetchData() {
            const query = `{
                stops(ids: ["${DEFAULT_STOP_ID}"]) {
                    gtfsId
                    name
                    desc
                    stoptimesWithoutPatterns(numberOfDepartures: ${DEFAULT_BUS_COUNT + 1}) {
                        serviceDay
                        realtimeArrival
                        realtime
                        headsign
                        trip {
                            route {
                                shortName
                            }
                        }
                    }
                }
            }`;

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'digitransit-subscription-key': apiKey
                    },
                    body: JSON.stringify({ query })
                });

                if (!response.ok) {
                    throw new Error(`API Error: ${response.status}`);
                }

                const json = await response.json();
                if (json.data && json.data.stops && json.data.stops.length > 0) {
                    stopData = json.data.stops[0];
                    renderStaticInfo();
                    updateCountdowns();
                    updateLastRefreshed();

                    // Adjust fetch interval based on real-time status
                    adjustFetchInterval();
                } else {
                    els.busList.innerHTML = '<div class="text-red-400 text-center py-4">Stop not found.</div>';
                }
            } catch (error) {
                console.error("Fetch error:", error);
                els.busList.innerHTML = `<div class="text-red-400 text-center py-4 text-sm">Connection Error.<br><span class="text-xs text-slate-500">${error.message}</span></div>`;
            }
        }

        function adjustFetchInterval() {
            if (!stopData || !stopData.stoptimesWithoutPatterns || stopData.stoptimesWithoutPatterns.length === 0) return;

            const now = Math.floor(Date.now() / 1000);
            const departures = stopData.stoptimesWithoutPatterns.filter(dep => {
                const arrivalTime = dep.serviceDay + dep.realtimeArrival;
                return (arrivalTime - now) > -30;
            });

            if (departures.length === 0) return;

            const firstBus = departures[0];
            const hasRealtime = firstBus.realtime;
            const newInterval = hasRealtime ? 15000 : 60000; // 15s for realtime, 60s for scheduled

            // Only update if interval changed
            if (fetchInterval && fetchInterval._interval !== newInterval) {
                clearInterval(fetchInterval);
                fetchInterval = setInterval(fetchData, newInterval);
                fetchInterval._interval = newInterval;
            }
        }

        function renderStaticInfo() {
            if (!stopData) return;
            els.stopName.innerText = stopData.name + (stopData.desc ? ` (${stopData.desc})` : '');
        }

        function updateLastRefreshed() {
            const now = new Date();
            els.lastUpdated.innerText = "Updated: " + now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        function updateCountdowns() {
            if (!stopData || !stopData.stoptimesWithoutPatterns) return;

            const now = Math.floor(Date.now() / 1000);
            const departures = stopData.stoptimesWithoutPatterns.filter(dep => {
                const arrivalTime = dep.serviceDay + dep.realtimeArrival;
                return (arrivalTime - now) > -30;
            });

            if (departures.length === 0) {
                els.heroDestination.innerText = "No buses soon";
                els.heroCountdown.innerText = "--:--";
                els.busList.innerHTML = '<div class="text-slate-500 text-center py-4">No upcoming departures.</div>';
                return;
            }

            // Hero (First Bus)
            const firstBus = departures[0];
            const firstSeconds = (firstBus.serviceDay + firstBus.realtimeArrival) - now;

            if (firstBus && firstBus.trip && firstBus.trip.route) {
                els.heroBusIcon.innerText = firstBus.trip.route.shortName;
                els.heroBusIcon.className = `w-10 h-10 rounded-lg flex items-center justify-center text-xl font-bold text-white border border-slate-700 shadow-lg ${getBusColor(firstBus.trip.route.shortName)}`;
                els.heroDestination.innerText = firstBus.headsign;
                els.heroCountdown.innerText = formatTime(Math.max(0, firstSeconds));

                // Real-time Badge
                if (firstBus.realtime) {
                    els.heroRealtimeBadge.innerText = "LIVE";
                    els.heroRealtimeBadge.className = "text-[10px] font-bold px-1.5 py-0.5 rounded border border-emerald-500/30 bg-emerald-500/20 text-emerald-400 animate-pulse";
                } else {
                    els.heroRealtimeBadge.innerText = "SCHEDULED";
                    els.heroRealtimeBadge.className = "text-[10px] font-bold px-1.5 py-0.5 rounded border border-slate-600/50 bg-slate-700/50 text-slate-400";
                }
                els.heroRealtimeBadge.classList.remove('hidden');

                const progress = Math.min(100, Math.max(0, (1 - (firstSeconds / 600)) * 100));
                els.progressBar.style.width = `${progress}%`;
                els.progressBar.className = `h-full transition-all duration-1000 ${firstSeconds < 60 ? 'bg-red-500 animate-pulse' : 'bg-brand-500'}`;
            }

            // List (Next Buses)
            let listHtml = '';
            for (let i = 1; i < departures.length; i++) {
                const bus = departures[i];
                if (!bus || !bus.trip || !bus.trip.route) continue;

                const seconds = (bus.serviceDay + bus.realtimeArrival) - now;

                listHtml += `
                <div class="flex justify-between items-center p-3 bg-slate-800/50 rounded-lg border border-slate-700/50 hover:bg-slate-800 transition-colors">
                    <div class="flex items-center gap-3">
                        <div class="w-8 h-8 rounded bg-slate-700 flex items-center justify-center text-sm font-bold text-slate-300 border border-slate-600">
                            ${bus.trip.route.shortName}
                        </div>
                        <div>
                            <p class="text-xs text-slate-400">To <span class="text-slate-200 font-medium">${bus.headsign}</span></p>
                        </div>
                    </div>
                    <div class="text-right flex flex-col items-end">
                        <span class="text-brand-400 font-mono font-medium tracking-tight text-lg">${formatTime(Math.max(0, seconds))}</span>
                        ${bus.realtime
                        ? '<span class="text-[10px] text-emerald-500 flex items-center gap-1"><i class="fa-solid fa-satellite-dish animate-pulse"></i> Live</span>'
                        : '<span class="text-[10px] text-slate-500 flex items-center gap-1"><i class="fa-regular fa-clock"></i> Sched</span>'}
                    </div>
                </div>`;
            }
            els.busList.innerHTML = listHtml;
        }

        function formatTime(seconds) {
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return `${m}:${s.toString().padStart(2, '0')}`;
        }

        function getBusColor(route) {
            const colors = ['bg-blue-600', 'bg-emerald-600', 'bg-violet-600', 'bg-orange-600', 'bg-pink-600'];
            let hash = 0;
            for (let i = 0; i < route.length; i++) {
                hash = route.charCodeAt(i) + ((hash << 5) - hash);
            }
            return colors[Math.abs(hash) % colors.length];
        }

        // Start
        init();
    </script>
</body>

</html>
